name: Validate site

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: python3 -B tools/test-reference-lookup.py
      - run: python3 -B tools/test-media-name-migration.py
      - run: python3 -B tools/test-additive-projection.py
      - run: node tools/validate-image-dedup.mjs
      - run: node tools/validate.mjs
      - name: Validate committed preview pack
        if: github.event_name != 'push'
        run: REQUIRE_PREVIEWS=1 node tools/validate.mjs

  pinned-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set isolated source checkout path
        run: echo "HF_SOURCE_ROOT=$RUNNER_TEMP/time-lapse-artifacts-source" >> "$GITHUB_ENV"
      - name: Fetch immutable Hugging Face metadata and pointer objects
        run: |
          git -c core.autocrlf=false init "$HF_SOURCE_ROOT"
          git -C "$HF_SOURCE_ROOT" remote add origin https://huggingface.co/datasets/maxwellinked/time-lapse-artifacts
          git -C "$HF_SOURCE_ROOT" fetch --filter=blob:none --no-tags origin \
            253e2ad859ea93b183110f19b5bbd78fc0bd6289 \
            dcfe6cb22fe20bc6677464875f2333600f32bf64 \
            12d5713326886bc18669f2a5c571c4fe7ac1fb73
      - name: Fetch accepted additive source revision when present
        run: |
          if test -f data/source-refresh.json; then
            revision="$(node -p 'JSON.parse(require("fs").readFileSync("data/source-refresh.json", "utf8")).sourceRevision')"
            test "${#revision}" -eq 40
            case "$revision" in *[!a-f0-9]*) exit 1 ;; esac
            git -C "$HF_SOURCE_ROOT" fetch --filter=blob:none --no-tags origin "$revision"
          fi
      - name: Check pinned migration, retained displays and historical evidence
        run: python3 -B tools/test-pinned-reproduction.py -v
      - name: Check accepted source ledger path and symlink guards on Linux
        run: |
          if test -f data/source-refresh.json; then
            revision="$(node -p 'JSON.parse(require("fs").readFileSync("data/source-refresh.json", "utf8")).sourceRevision')"
            test "${#revision}" -eq 40
            case "$revision" in *[!a-f0-9]*) exit 1 ;; esac
            checkdir="$RUNNER_TEMP/accepted-source-wall-clock-tests"
            mkdir -p "$checkdir/tools"
            for filename in wall_clock_declarations.py create_wall_clock_ledger.py test_wall_clock_declarations.py; do
              git -C "$HF_SOURCE_ROOT" show "$revision:tools/$filename" > "$checkdir/tools/$filename"
            done
            (
              cd "$checkdir"
              python3 -B -m unittest \
                tools.test_wall_clock_declarations.WallClockDeclarationTests.test_authoring_rejects_unsafe_output_paths_and_symlinks \
                tools.test_wall_clock_declarations.WallClockDeclarationTests.test_unsafe_or_mismatched_receipt_fails
            )
          fi
