name: Validate site

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: python3 -B tools/test-reference-lookup.py
      - run: node tools/validate-image-dedup.mjs
      - run: node tools/validate.mjs
      - name: Validate committed preview pack
        if: github.event_name != 'push'
        run: REQUIRE_PREVIEWS=1 node tools/validate.mjs
