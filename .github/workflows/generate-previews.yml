name: Generate dynamic previews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-previews.yml
      - data/records.json
      - tools/generate-previews.mjs
      - tools/generate-record-anchors.mjs
      - tools/publish-previews.sh
      - tools/validate.mjs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: generate-previews
  cancel-in-progress: false

jobs:
  previews:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Capture encoder toolchain provenance
        run: |
          {
            printf 'Toolchain for added or modified previews listed below; excludes cached previews.\n'
            printf 'Run: %s/%s/actions/runs/%s\nAttempt: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Checkout: %s\n' "$(git rev-parse HEAD)"
            printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
            ffmpeg -version
            dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\n' ffmpeg 'libx264-*'
            printf '\nSHA-256 of FFmpeg executable, source index and generator:\n'
            sha256sum "$(command -v ffmpeg)" data/records.json tools/generate-previews.mjs
          } > "$RUNNER_TEMP/preview-toolchain.txt"

      - name: Generate late-stage motion previews
        run: node tools/generate-previews.mjs --concurrency 6

      - name: Generate corresponding recording images
        run: node tools/generate-record-anchors.mjs

      - name: Validate complete website and preview pack
        run: REQUIRE_PREVIEWS=1 node tools/validate.mjs

      - name: Submit generated previews for validation and review
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-previews.sh
